[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ggufgauge"
version = "0.1.0"
description = "Container-aware GGUF launch preflight for local AI"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["PySide6==6.9.1"]
authors = [{ name = "RequiredTruth" }]
keywords = ["gguf", "llama-cpp", "local-ai", "cgroup", "cpu-inference"]

[project.scripts]
ggufgauge = "ggufgauge.cli:main"

[tool.setuptools.packages.find]
include = ["ggufgauge*"]
